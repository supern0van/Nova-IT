name: E2E

# Medvetet INTE på pull_request - se playwright.config.ts:s kommentar och
# docs/changes/NOVA-0068. Ett Playwright-jobb (webbläsarnedladdning + en
# riktig browserkörning) lägger normalt 2-5 extra minuter på varje körning,
# vilket hade bromsat PR-feedback-loopen som ci.yml (test/lint/typecheck/
# build) idag ger på under en minut. E2E körs i stället bara på push till
# main (fångar en regression inom ett dygn i värsta fall) och en nattlig
# schemalagd körning som ett oberoende säkerhetsnät.
on:
  push:
    branches:
      - main
  schedule:
    # 02:00 UTC varje natt.
    - cron: "0 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck E2E-tester
        run: bun run typecheck:e2e

      # Bara Chromium - projects i playwright.config.ts kör inget annat i
      # dagsläget, ingen anledning att ladda ner Firefox/WebKit också.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run E2E-tester
        run: bun run e2e

      - name: Upload Playwright-rapport vid fel
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
