name: CI

on:
  push:
    branches:
      - main
      - site-foundation
      - "feature/**"
      - "fix/**"
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# De fyra kontrollerna (test/lint/typecheck/build) är oberoende av varandra -
# ingen av dem behöver en annan kontrolls output. Tidigare kördes de som
# fyra sekventiella steg i EN job, vilket gjorde total CI-tid till summan av
# alla fyra. Som fyra parallella jobb blir väggklockstiden i stället den
# LÅNGSAMMASTE av de fyra (normalt build) - en snabb lint-/typecheck-miss
# syns nu på egen hand utan att vänta på hela kedjan.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run support tests
        run: bun run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Vites egen transform-/dep-optimeringscache (node_modules/.vite) och
      # Nitros byggcache (.nitro) - sparar arbete mellan körningar. Nyckeln
      # inkluderar lockfilen och källkoden: en ändring i endera bygger en
      # färsk cache, annars återanvänds den senaste. `restore-keys` faller
      # tillbaka till senaste cachen för samma lockfile-generation även om
      # källkods-hashen inte matchar exakt.
      - name: Cache Vite/Nitro build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.vite
            .nitro
          key: ${{ runner.os }}-vite-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

  # Rapporterande, inte blockerande: Dependabot är bara konfigurerat för
  # version-uppdateringar (se .github/dependabot.yml), inget steg fångade
  # tidigare kända CVE:er i det låsta beroendeträdet. `continue-on-error`
  # gäller oavsett `bun audit`s egna exitkod-semantik (som redan var 0 vid
  # fynd i den version detta skrevs mot) - jobbet ska aldrig blockera en
  # merge, bara göra sårbarheter synliga i loggen. INTE med i `verify`s
  # `needs` av samma skäl.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun audit` exitar icke-noll så fort NÅGON sårbarhet hittas
      # (bekräftat i CI, oavsett severity) - `|| true` gör steget till ett
      # rent rapporterande jobb (grönt i checks-listan, fynden syns ändå i
      # loggen) i stället för att förlita sig på continue-on-error, som
      # visar jobbet som misslyckat i PR-checks trots att det inte
      # blockerar något - onödigt brus för både människor och CI-verktyg
      # som bevakar checks.
      - name: Run dependency audit
        run: bun audit || true

  verify:
    name: Verify frontend
    if: ${{ always() }}
    needs:
      - test
      - lint
      - typecheck
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all frontend checks passed
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
