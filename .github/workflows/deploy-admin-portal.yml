name: Deploy admin portal

# Manuell trigger med avsikt - varje deploy till produktion ska vara ett
# medvetet klick, inte automatiskt vid varje merge till main. Samma princip
# som Kundportalens deploy.yml (supern0van/Nova-IT-Kundportal).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/commit att deploya (standard: main)"
        required: false
        default: "main"

concurrency:
  group: deploy-admin-portal
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: portal

jobs:
  deploy:
    name: Build och deploya nova-it-admin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: portal/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI-kedjan (test, lint, typecheck, build)
        run: pnpm run ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.ADMIN_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ADMIN_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Kontrollera att obligatoriska Worker-secrets finns
        run: pnpm worker:secrets:check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploya till Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.ADMIN_NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.ADMIN_NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Live-smoke mot admin.nova-it.se
        run: pnpm smoke:worker
