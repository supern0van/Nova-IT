[test]
# Registrerar en DOM (happy-dom) globalt innan testfilerna körs - krävs för
# att @testing-library/react ska kunna rendera komponenter under `bun test`.
# Se happydom.ts.
preload = ["./happydom.ts"]

[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = []
